# Runtime environment for MicroGridsPy (Pyomo path) + the linopy port (Code/linopy_port/).
#
# Pinned to the LOCAL `mgpy` env the linopy regression baselines were produced on
# (read from `conda list -n mgpy`, 2026-09-11) -- e.g. smoketest_1sc_2y NPC $2,717,089.04.
#
#   conda env create -f environment.yml
#   conda activate mgpy
#
# Gurobi: installing gurobipy does NOT bring a license. The machine still needs its own
# gurobi.lic / WLS academic license (a copied file is usually tied to another machine).
#
# KNOWN SECOND ENVIRONMENT -- the HPC env (`myenv`) is NOT this one. It runs Python 3.11.15,
# linopy 0.9.1, gurobipy 13.0.2, pyomo 6.10.1, numpy 2.4.6, pandas 3.0.3, exported on 2026-09-17 to
# environment_hpc.yml (Linux only; drop its torch/triton/nvidia-* lines unless PyTorch's own package
# index is configured -- MicroGridsPy does not use torch). Both envs have
# produced matching results, but they are not interchangeable in every detail: linopy 0.5.5
# (here) rejects `int - Variable` (reflected subtraction) where 0.9.1 accepts it -- write
# `BIG_M - BIG_M * var`, never `BIG_M * (1 - var)`, in any shared linopy code.
name: mgpy
channels:
  - gurobi
  - defaults
dependencies:
  - python=3.9.18
  - pip=23.3
  - gurobi=12.0.3
  - pip:
      - linopy==0.5.5
      - pyomo==6.6.2
      - numpy==1.25.2
      - pandas==2.1.1
      - xarray==2024.7.0
      - scipy==1.13.1
      - bottleneck==1.3.5
      - dask==2024.8.0
      - polars==1.36.1
      - highspy==1.15.1
      - psutil==5.9.0
      - openpyxl==3.1.2
      - matplotlib==3.7.4
